[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unispace-ai"
version = "0.1.0"
description = "Интеллектуальная образовательная платформа для студентов: AI Tutor, учебные планы, тесты, карточки, аналитика."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.6",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/unispace"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Query() в значениях по умолчанию — штатная идиома FastAPI
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
